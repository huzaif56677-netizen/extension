<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 240px;
      padding: 20px;
      background: #12121e;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }
    #status {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
    }
    #toggle-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: rgba(99, 102, 241, 0.8);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      font-family: inherit;
    }
    #toggle-btn:hover { opacity: 0.85; }
    #toggle-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .version {
      text-align: center;
      font-size: 10px;
      color: #333;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="title">&#x1F43E; Browser Pet</div>
  <p id="status">Checking...</p>
  <button id="toggle-btn">Loading...</button>
  <p class="version">v1.0.0</p>
  <script src="popup.js"></script>
</body>
</html>
